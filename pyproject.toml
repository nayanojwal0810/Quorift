[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quorift"
version = "0.1.0"
description = "Local enterprise banking knowledge assistant with RAG, semantic caching, and document permissions."
requires-python = ">=3.11, <3.12"
dependencies = [
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
