[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quorift"
version = "0.1.0"
description = "Local enterprise banking knowledge assistant with RAG, semantic caching, and document permissions."
requires-python = ">=3.11, <3.12"
dependencies = [
    "reportlab>=4.0.0",
    "pymupdf>=1.24.0",
    "sentence-transformers>=6.3.0",
    "qdrant-client>=1.20.0",
    "bm25s>=0.3.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
